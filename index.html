<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows 95 in the Browser</title>
<meta name="description" content="Windows 95 running in your browser.">
<style>
/* A single Win95-style window fills the browser pane. */
:root {
  --desk: #008080;          /* the classic teal desktop */
  --face: #c0c0c0;          /* 3D button face */
  --hi: #ffffff;            /* bevel highlight */
  --shadow: #808080;        /* bevel shadow */
  --dark: #000000;          /* outer bevel shadow */
  --title-a: #000080;       /* active title bar */
  --title-b: #1084d0;
  --ink: #000000;
  --ui: "Tahoma", "MS Sans Serif", "Segoe UI", system-ui, sans-serif;
  --mono: "Courier New", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  background: var(--desk);
  color: var(--ink);
  font: 13px/1.35 var(--ui);
  padding: 0;
}
.window {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--face);
  border: 2px solid;
  border-color: var(--hi) var(--dark) var(--dark) var(--hi);
  box-shadow: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 #dfdfdf;
  padding: 3px;
}
.titlebar {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(90deg, var(--title-a), var(--title-b));
  color: var(--hi);
  font-weight: bold;
  padding: 2px 3px;
  min-height: 24px;
}
.titlebar h1 { font-size: 13px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .logo { width: 16px; height: 16px; flex: none; }
.window-controls { display: flex; gap: 2px; margin-left: auto; }
.network-choice { color: #fff; font: 11px var(--ui); white-space: nowrap; }
.network-choice select { max-width: 118px; font: 11px var(--ui); }
#network_status { font: 11px var(--ui); max-width: 145px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.window-controls button {
  font: inherit; color: var(--ink);
  background: var(--face);
  border: 2px solid;
  border-color: var(--hi) var(--dark) var(--dark) var(--hi);
  box-shadow: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 #dfdfdf;
  width: 22px; height: 19px; padding: 0; line-height: 14px; cursor: pointer;
  font-size: 14px; font-weight: bold;
}
.window-controls button:active {
  border-color: var(--dark) var(--hi) var(--hi) var(--dark);
  box-shadow: inset 1px 1px 0 var(--shadow);
}
.window-controls button:focus-visible { outline: 1px dotted var(--ink); outline-offset: -5px; }
.window.minimized { position: absolute; bottom: 0; left: 0; width: min(300px, 100%); height: auto; }
.window.minimized .screen-well { display: none; }
#closed { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: bold; }

.screen-well {
  background: var(--dark);
  overflow: hidden;
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: block;
}
#screen_container { position: absolute; inset: 0; width: 100%; height: 100%; line-height: 0; overflow: hidden; }
#screen_container > div { white-space: pre; font: 14px/14px var(--mono); color: #fff; line-height: 14px; }
#screen_container canvas { display: block; position: absolute; inset: 0; width: 100% !important; height: 100% !important; image-rendering: pixelated; }

.boot {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
  color: #fff; background: var(--dark); padding: 16px; text-align: center;
}
.boot p { margin: 0; max-width: 46ch; }
.meter {
  width: min(320px, 100%); height: 20px; padding: 2px;
  border: 2px solid; border-color: var(--shadow) var(--hi) var(--hi) var(--shadow);
  background: var(--face);
}
.meter span { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--title-a) 0 10px, transparent 10px 12px); transition: width .2s; }
@media (prefers-reduced-motion: reduce) { .meter span { transition: none; } }

</style>
</head>
<body>

<main class="window" id="window">
  <div class="titlebar">
    <svg class="logo" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="#f25022"/><rect x="9" y="1" width="6" height="6" fill="#7fba00"/><rect x="1" y="9" width="6" height="6" fill="#00a4ef"/><rect x="9" y="9" width="6" height="6" fill="#ffb900"/></svg>
    <h1>Windows 95</h1>
    <label class="network-choice" for="network_mode">Network <select id="network_mode"><option value="internet">Internet</option><option value="local">Browser-local</option></select></label>
    <span id="network_status" role="status" title="Network status">Connecting…</span>
    <div class="window-controls" aria-label="Window controls">
      <button id="minimize" type="button" aria-label="Minimize" title="Minimize">_</button>
      <button id="maximize" type="button" aria-label="Maximize" title="Maximize">□</button>
      <button id="close" type="button" aria-label="Close" title="Close">×</button>
    </div>
  </div>

  <div class="screen-well" id="well">
    <div id="screen_container">
      <div></div>
      <canvas style="display: none"></canvas>
    </div>
    <div class="boot" id="boot">
      <p><strong>Starting Windows 95…</strong></p>
      <div class="meter" aria-hidden="true"><span id="meter"></span></div>
      <p id="boot_msg" role="status">Starting Windows 95</p>
    </div>
  </div>
</main>
<div id="closed" hidden>Windows 95 closed. Reload the page to start again.</div>

<script src="build/libv86.js"></script>
<script>
"use strict";
(function () {
  const $ = (id) => document.getElementById(id);
  let emulator = null;
  let closed = false;
  let resumeAfterMinimize = false;
  const mode = new URL(location.href).searchParams.get("network") === "local" ? "local" : "internet";
  let networkSocket = null;
  $("network_mode").value = mode;
  $("network_mode").onchange = () => {
    const url = new URL(location.href);
    url.searchParams.set("network", $("network_mode").value);
    location.assign(url);
  };

  function networkStatus(message) {
    $("network_status").textContent = message;
    $("network_status").title = message;
  }

  async function connectInternet() {
    const response = await fetch("/v1/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ttlSeconds: 3600 }),
    });
    if (!response.ok) throw new Error("session request failed (" + response.status + ")");
    const session = await response.json();
    const socket = new WebSocket("wss://" + location.host + "/v1/ethernet", "v86net." + session.token);
    socket.binaryType = "arraybuffer";
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("gateway timeout")), 12000);
      socket.onopen = () => { clearTimeout(timer); resolve(); };
      socket.onerror = () => { clearTimeout(timer); reject(new Error("gateway connection failed")); };
    });
    networkSocket = socket;
    networkStatus("Internet connected");
    return socket;
  }

  async function boot() {
    let socket = null;
    if (mode === "internet") {
      try { socket = await connectInternet(); }
      catch (error) {
        networkStatus("Internet unavailable");
        $("boot_msg").textContent = error.message + ". Select Browser-local to continue.";
        return;
      }
    } else networkStatus("Browser-local only");
    if (closed) { socket?.close(); return; }
    emulator = new V86({
      wasm_path: "build/v86.wasm",
      screen_container: $("screen_container"),
      memory_size: 64 * 1024 * 1024,
      vga_memory_size: 8 * 1024 * 1024,
      bios: { url: "bios/seabios.bin" },
      vga_bios: { url: "bios/vgabios.bin" },
      hda: {
        url: "images/windows95-v3/.img",
        size: 471859200,
        async: true,
        fixed_chunk_size: 256 * 1024,
        use_parts: true,
      },
      net_device: mode === "local" ? { type: "ne2k", relay_url: "inbrowser" } : { type: "ne2k" },
      autostart: true,
    });
    if (socket) {
      emulator.add_listener("net0-send", frame => {
        if (socket.readyState === WebSocket.OPEN && socket.bufferedAmount < 1 << 20) socket.send(frame);
      });
      socket.onmessage = event => {
        if (event.data instanceof ArrayBuffer && event.data.byteLength >= 14) {
          emulator.bus.send("net0-receive", new Uint8Array(event.data));
        }
      };
      socket.onclose = () => networkStatus("Internet disconnected — reload to reconnect");
    }
    window.emulator = emulator;
    wire();
  }

  let started = false;

  function wire() {
    emulator.add_listener("download-progress", (e) => {
      if (started || closed) return;
      const pct = e.total ? Math.round(100 * e.loaded / e.total) : 0;
      $("meter").style.width = pct + "%";
      $("boot_msg").textContent = "Loading disk " + (e.file_index + 1) + " of " + e.file_count +
        (e.total ? " — " + pct + "%" : "");
    });
    emulator.add_listener("download-error", () => {
      if (closed) return;
      $("meter").hidden = true;
      $("boot_msg").textContent = "Could not load the server image. Reload the page to retry.";
    });
    emulator.add_listener("emulator-ready", () => {
      if (closed) return;
      started = true;
      $("boot").hidden = true;
    });
  }

  function restoreWindow() {
    $("window").classList.remove("minimized");
    $("minimize").setAttribute("aria-label", "Minimize");
    $("minimize").title = "Minimize";
    if (resumeAfterMinimize && emulator) emulator.run();
    resumeAfterMinimize = false;
  }

  $("minimize").onclick = async () => {
    if ($("window").classList.contains("minimized")) {
      restoreWindow();
      return;
    }
    if (document.fullscreenElement) {
      try { await document.exitFullscreen(); } catch (_) { /* Continue minimizing. */ }
    }
    resumeAfterMinimize = !!emulator?.is_running();
    if (resumeAfterMinimize) emulator.stop();
    $("window").classList.add("minimized");
    $("minimize").setAttribute("aria-label", "Restore");
    $("minimize").title = "Restore";
  };

  $("maximize").onclick = async () => {
    if ($("window").classList.contains("minimized")) restoreWindow();
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await $("window").requestFullscreen();
    } catch (_) { /* Fullscreen can be denied by browser policy. */ }
  };

  $("close").onclick = async () => {
    closed = true;
    if (document.fullscreenElement) {
      try { await document.exitFullscreen(); } catch (_) { /* Continue closing. */ }
    }
    if (emulator?.is_running()) emulator.stop();
    networkSocket?.close();
    $("window").hidden = true;
    $("closed").hidden = false;
  };

  document.addEventListener("fullscreenchange", () => {
    const maximized = !!document.fullscreenElement;
    $("maximize").setAttribute("aria-label", maximized ? "Restore" : "Maximize");
    $("maximize").title = maximized ? "Restore" : "Maximize";
    $("maximize").textContent = maximized ? "❐" : "□";
  });
  boot();
})();
</script>
</body>
</html>
