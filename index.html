<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows 95 in the Browser</title>
<meta name="description" content="Windows 95 running in your browser.">
<style>
/* A single Win95-style window fills the browser pane. */
:root {
  --desk: #008080;          /* the classic teal desktop */
  --face: #c0c0c0;          /* 3D button face */
  --hi: #ffffff;            /* bevel highlight */
  --shadow: #808080;        /* bevel shadow */
  --dark: #000000;          /* outer bevel shadow */
  --title-a: #000080;       /* active title bar */
  --title-b: #1084d0;
  --ink: #000000;
  --ui: "Tahoma", "MS Sans Serif", "Segoe UI", system-ui, sans-serif;
  --mono: "Courier New", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  background: var(--desk);
  color: var(--ink);
  font: 13px/1.35 var(--ui);
  padding: 0;
}
.window {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--face);
  border: 2px solid;
  border-color: var(--hi) var(--dark) var(--dark) var(--hi);
  box-shadow: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 #dfdfdf;
  padding: 3px;
}
.titlebar {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(90deg, var(--title-a), var(--title-b));
  color: var(--hi);
  font-weight: bold;
  padding: 2px 3px;
  min-height: 24px;
}
.titlebar h1 { font-size: 13px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .logo { width: 16px; height: 16px; flex: none; }
.window-controls { display: flex; gap: 2px; margin-left: auto; }
.agent-toggle { font: 11px var(--ui); padding: 1px 6px; color: var(--ink); cursor: pointer; }
.agent-activity { display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 240px; font: 11px var(--ui); }
#agent_brief { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#agent_stop { flex: none; font: 11px var(--ui); cursor: pointer; }
.agent-panel {
  position: absolute; z-index: 5; top: 8px; left: 8px;
  width: min(420px, calc(100% - 16px));
  padding: 9px; background: var(--face);
  border: 2px solid; border-color: var(--hi) var(--dark) var(--dark) var(--hi);
  box-shadow: 2px 2px 0 #0008;
  display: grid; gap: 6px;
}
.agent-panel-titlebar {
  display: flex; align-items: center; gap: 6px;
  margin: -9px -9px 2px; padding: 3px 4px;
  background: linear-gradient(90deg, var(--title-a), var(--title-b));
  color: var(--hi); cursor: move; touch-action: none; user-select: none;
}
.agent-panel-titlebar strong { flex: 1; }
.agent-panel-titlebar button { width: 22px; height: 19px; padding: 0; line-height: 14px; font-weight: bold; }
.agent-panel label { font-weight: bold; }
.agent-panel textarea { width: 100%; min-height: 70px; resize: vertical; font: 13px var(--ui); }
.agent-panel textarea[data-suggested="true"] { color: #555; font-style: italic; }
.agent-hint { font-size: 11px; }
.agent-panel .agent-actions { display: flex; gap: 6px; }
.agent-panel button { font: 12px var(--ui); padding: 3px 10px; cursor: pointer; }
.agent-panel button.listening { color: #a00000; border-color: #a00000; }
.agent-voice-note { font-size: 11px; color: #444; }
.agent-panel output { display: block; min-height: 30px; max-height: 70px; overflow: auto; font-size: 12px; }
.network-choice { color: #fff; font: 11px var(--ui); white-space: nowrap; }
.network-choice select { max-width: 118px; font: 11px var(--ui); }
#network_status { font: 11px var(--ui); max-width: 145px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.window-controls button {
  font: inherit; color: var(--ink);
  background: var(--face);
  border: 2px solid;
  border-color: var(--hi) var(--dark) var(--dark) var(--hi);
  box-shadow: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 #dfdfdf;
  width: 22px; height: 19px; padding: 0; line-height: 14px; cursor: pointer;
  font-size: 14px; font-weight: bold;
}
.window-controls button:active {
  border-color: var(--dark) var(--hi) var(--hi) var(--dark);
  box-shadow: inset 1px 1px 0 var(--shadow);
}
.window-controls button:focus-visible { outline: 1px dotted var(--ink); outline-offset: -5px; }
.window.minimized { position: absolute; bottom: 0; left: 0; width: min(300px, 100%); height: auto; }
.window.minimized .screen-well { display: none; }
#closed { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: bold; }

.screen-well {
  background: var(--dark);
  overflow: hidden;
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: block;
}
#screen_container { position: absolute; inset: 0; width: 100%; height: 100%; line-height: 0; overflow: hidden; }
#screen_container > div { white-space: pre; font: 14px/14px var(--mono); color: #fff; line-height: 14px; }
#screen_container canvas { display: block; position: absolute; inset: 0; width: 100% !important; height: 100% !important; image-rendering: pixelated; }

.boot {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
  color: #fff; background: var(--dark); padding: 16px; text-align: center;
}
.boot p { margin: 0; max-width: 46ch; }
.meter {
  width: min(320px, 100%); height: 20px; padding: 2px;
  border: 2px solid; border-color: var(--shadow) var(--hi) var(--hi) var(--shadow);
  background: var(--face);
}
.meter span { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--title-a) 0 10px, transparent 10px 12px); transition: width .2s; }
@media (prefers-reduced-motion: reduce) { .meter span { transition: none; } }
@media (max-width: 700px) {
  #network_status { display: none; }
  .agent-activity { max-width: 130px; }
}

</style>
</head>
<body>

<main class="window" id="window">
  <div class="titlebar">
    <svg class="logo" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="#f25022"/><rect x="9" y="1" width="6" height="6" fill="#7fba00"/><rect x="1" y="9" width="6" height="6" fill="#00a4ef"/><rect x="9" y="9" width="6" height="6" fill="#ffb900"/></svg>
    <h1>Windows 95</h1>
    <button id="agent_toggle" class="agent-toggle" type="button" aria-expanded="false" aria-controls="agent_panel">Jev agent</button>
    <div id="agent_activity" class="agent-activity" hidden>
      <span id="agent_brief" role="status" aria-live="polite"></span>
      <button id="agent_stop" type="button" disabled hidden>Cancel</button>
    </div>
    <label class="network-choice" for="network_mode">Network <select id="network_mode"><option value="internet">Internet</option><option value="local">Browser-local</option></select></label>
    <span id="network_status" role="status" title="Network status">Connecting…</span>
    <div class="window-controls" aria-label="Window controls">
      <button id="minimize" type="button" aria-label="Minimize" title="Minimize">_</button>
      <button id="maximize" type="button" aria-label="Maximize" title="Maximize">□</button>
      <button id="close" type="button" aria-label="Close" title="Close">×</button>
    </div>
  </div>

  <div class="screen-well" id="well">
    <div id="screen_container">
      <div></div>
      <canvas style="display: none"></canvas>
    </div>
    <div class="boot" id="boot">
      <p><strong>Starting Windows 95…</strong></p>
      <div class="meter" aria-hidden="true"><span id="meter"></span></div>
      <p id="boot_msg" role="status">Starting Windows 95</p>
    </div>
    <section class="agent-panel" id="agent_panel" aria-label="Jev agent" hidden>
      <div class="agent-panel-titlebar" id="agent_panel_drag">
        <strong>Jev agent</strong>
        <button id="agent_panel_close" type="button" aria-label="Close agent window" title="Close">×</button>
      </div>
      <label for="agent_goal">What should Windows 95 do?</label>
      <textarea id="agent_goal" maxlength="2000" aria-describedby="agent_hint" placeholder="Describe a Windows 95 task"></textarea>
      <span id="agent_hint" class="agent-hint">→ Accept suggestion · Enter Run · Shift+Enter new line</span>
      <div class="agent-actions">
        <button id="agent_voice" type="button" aria-label="Start voice dictation" aria-pressed="false">🎙 Dictate</button>
        <button id="agent_shuffle" type="button">Shuffle</button>
        <button id="agent_run" type="button" disabled>Run</button>
        <button id="agent_cancel" type="button" disabled>Cancel</button>
      </div>
      <span id="agent_voice_status" class="agent-voice-note" role="status" aria-live="polite"></span>
      <span class="agent-voice-note">Speech recognition may use your browser’s online service.</span>
      <output id="agent_state" aria-live="polite">Waiting for Windows 95. Put exact text to type in quotes.</output>
    </section>
  </div>
</main>
<div id="closed" hidden>Windows 95 closed. Reload the page to start again.</div>

<script src="build/libv86.js"></script>
<script type="module">
import { DISK_IMAGE, prepareDiskCache } from "./disk-cache.mjs";
import { nextWindowsPrompt } from "./agent-prompts.mjs";
"use strict";
(function () {
  const $ = (id) => document.getElementById(id);
  let emulator = null;
  let closed = false;
  let resumeAfterMinimize = false;
  let agent = null;
  let agentBusy = false;
  let cancelRequested = false;
  let ocrLoading = null;
  let voiceRecognition = null;
  let voiceBaseText = "";
  const mode = new URL(location.href).searchParams.get("network") === "local" ? "local" : "internet";
  let networkSocket = null;
  $("network_mode").value = mode;
  $("network_mode").onchange = () => {
    const url = new URL(location.href);
    url.searchParams.set("network", $("network_mode").value);
    location.assign(url);
  };

  function networkStatus(message) {
    $("network_status").textContent = message;
    $("network_status").title = message;
  }

  async function connectInternet() {
    const response = await fetch("/v1/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ttlSeconds: 3600 }),
    });
    if (!response.ok) throw new Error("session request failed (" + response.status + ")");
    const session = await response.json();
    const socket = new WebSocket("wss://" + location.host + "/v1/ethernet", "v86net." + session.token);
    socket.binaryType = "arraybuffer";
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("gateway timeout")), 12000);
      socket.onopen = () => { clearTimeout(timer); resolve(); };
      socket.onerror = () => { clearTimeout(timer); reject(new Error("gateway connection failed")); };
    });
    networkSocket = socket;
    networkStatus("Internet connected");
    return socket;
  }

  async function boot() {
    // Claim this first visit before V86 issues its initial image-part XHRs.
    await prepareDiskCache();
    if (closed) return;
    let socket = null;
    if (mode === "internet") {
      try { socket = await connectInternet(); }
      catch (error) {
        networkStatus("Internet unavailable");
        $("boot_msg").textContent = error.message + ". Select Browser-local to continue.";
        return;
      }
    } else networkStatus("Browser-local only");
    if (closed) { socket?.close(); return; }
    emulator = new V86({
      wasm_path: "build/v86.wasm",
      screen_container: $("screen_container"),
      memory_size: 64 * 1024 * 1024,
      vga_memory_size: 8 * 1024 * 1024,
      bios: { url: "bios/seabios.bin" },
      vga_bios: { url: "bios/vgabios.bin" },
      hda: {
        url: DISK_IMAGE.url,
        size: DISK_IMAGE.size,
        async: true,
        fixed_chunk_size: DISK_IMAGE.chunkSize,
        use_parts: true,
      },
      net_device: mode === "local" ? { type: "ne2k", relay_url: "inbrowser" } : { type: "ne2k" },
      autostart: true,
    });
    if (socket) {
      emulator.add_listener("net0-send", frame => {
        if (socket.readyState === WebSocket.OPEN && socket.bufferedAmount < 1 << 20) socket.send(frame);
      });
      socket.onmessage = event => {
        if (event.data instanceof ArrayBuffer && event.data.byteLength >= 14) {
          emulator.bus.send("net0-receive", new Uint8Array(event.data));
        }
      };
      socket.onclose = () => networkStatus("Internet disconnected — reload to reconnect");
    }
    window.emulator = emulator;
    wire();
  }

  let started = false;

  function wire() {
    emulator.add_listener("download-progress", (e) => {
      if (started || closed) return;
      const pct = e.total ? Math.round(100 * e.loaded / e.total) : 0;
      $("meter").style.width = pct + "%";
      $("boot_msg").textContent = "Loading disk " + (e.file_index + 1) + " of " + e.file_count +
        (e.total ? " — " + pct + "%" : "");
    });
    emulator.add_listener("download-error", () => {
      if (closed) return;
      $("meter").hidden = true;
      $("boot_msg").textContent = "Could not load the server image. Reload the page to retry.";
    });
    emulator.add_listener("emulator-ready", () => {
      if (closed) return;
      started = true;
      $("boot").hidden = true;
      $("agent_run").disabled = false;
      $("agent_state").textContent = "Ready. Describe a goal, then press Run.";
    });
  }

  function suggestPrompt() {
    const field = $("agent_goal");
    field.value = nextWindowsPrompt(field.value);
    field.dataset.suggested = "true";
    field.focus();
    field.setSelectionRange(0, 0);
  }

  function acceptPrompt() {
    const field = $("agent_goal");
    field.dataset.suggested = "false";
    field.setSelectionRange(field.value.length, field.value.length);
  }

  function showAgentPanel(show) {
    const panel = $("agent_panel");
    if (!show && panel.contains(document.activeElement)) document.activeElement.blur();
    panel.hidden = !show;
    $("agent_toggle").setAttribute("aria-expanded", String(show));
    if (show && !agentBusy) {
      if (!$("agent_goal").value.trim()) suggestPrompt();
      else $("agent_goal").focus();
    }
  }

  function agentMessage(message) {
    $("agent_state").textContent = message;
    $("agent_brief").textContent = message;
    $("agent_brief").title = message;
  }

  function agentBusyState(busy) {
    agentBusy = busy;
    $("agent_run").disabled = busy || !started || closed;
    $("agent_goal").disabled = busy;
    $("agent_shuffle").disabled = busy;
    $("agent_voice").disabled = busy || !("SpeechRecognition" in window || "webkitSpeechRecognition" in window);
    $("agent_cancel").disabled = !busy;
    $("agent_stop").disabled = !busy;
    $("agent_stop").hidden = !busy;
    $("agent_toggle").textContent = busy ? "Jev running…" : "Jev agent";
  }

  function ensureOcr() {
    if (window.Tesseract) return Promise.resolve();
    if (!ocrLoading) {
      ocrLoading = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        const timer = setTimeout(() => finish(new Error("Screen reader download timed out")), 15000);
        function finish(error) {
          clearTimeout(timer);
          script.onload = script.onerror = null;
          script.remove();
          if (error) reject(error); else resolve();
        }
        script.src = "/kalib/ocr/tesseract.min.js";
        script.onload = () => finish(window.Tesseract ? null : new Error("Screen reader unavailable"));
        script.onerror = () => finish(new Error("Could not load the screen reader"));
        document.head.append(script);
      }).catch(error => { ocrLoading = null; throw error; });
    }
    return ocrLoading;
  }

  $("agent_toggle").onclick = () => {
    if ($("window").classList.contains("minimized")) restoreWindow();
    showAgentPanel($("agent_panel").hidden);
  };
  $("agent_panel_close").onclick = () => {
    showAgentPanel(false);
    $("agent_toggle").focus();
  };
  const panelDrag = $("agent_panel_drag");
  let panelDragState = null;
  panelDrag.addEventListener("pointerdown", event => {
    if (event.button !== 0 || event.target.closest("button")) return;
    const panel = $("agent_panel");
    const well = $("well");
    const panelBounds = panel.getBoundingClientRect();
    const wellBounds = well.getBoundingClientRect();
    panelDragState = {
      pointerId: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      left: panelBounds.left - wellBounds.left,
      top: panelBounds.top - wellBounds.top,
    };
    panel.style.left = panelDragState.left + "px";
    panel.style.top = panelDragState.top + "px";
    panel.style.right = "auto";
    panel.style.bottom = "auto";
    panelDrag.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  panelDrag.addEventListener("pointermove", event => {
    if (!panelDragState || event.pointerId !== panelDragState.pointerId) return;
    const panel = $("agent_panel");
    const well = $("well");
    const maxLeft = Math.max(0, well.clientWidth - panel.offsetWidth);
    const maxTop = Math.max(0, well.clientHeight - panel.offsetHeight);
    const left = panelDragState.left + event.clientX - panelDragState.x;
    const top = panelDragState.top + event.clientY - panelDragState.y;
    panel.style.left = Math.min(maxLeft, Math.max(0, left)) + "px";
    panel.style.top = Math.min(maxTop, Math.max(0, top)) + "px";
  });
  function finishPanelDrag(event) {
    if (!panelDragState || event.pointerId !== panelDragState.pointerId) return;
    if (panelDrag.hasPointerCapture(event.pointerId)) panelDrag.releasePointerCapture(event.pointerId);
    panelDragState = null;
  }
  panelDrag.addEventListener("pointerup", finishPanelDrag);
  panelDrag.addEventListener("pointercancel", finishPanelDrag);
  $("agent_shuffle").onclick = () => { if (!agentBusy) suggestPrompt(); };
  $("agent_goal").oninput = () => { $("agent_goal").dataset.suggested = "false"; };

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    $("agent_voice").disabled = true;
    $("agent_voice").title = "Voice dictation is not supported by this browser.";
    $("agent_voice_status").textContent = "Voice dictation is not available in this browser.";
  }

  function clearVoiceButton() {
    $("agent_voice").textContent = "🎙 Dictate";
    $("agent_voice").setAttribute("aria-label", "Start voice dictation");
    $("agent_voice").setAttribute("aria-pressed", "false");
    $("agent_voice").classList.remove("listening");
  }

  function stopDictationForRun() {
    const recognition = voiceRecognition;
    voiceRecognition = null;
    if (recognition) {
      recognition.onresult = null;
      recognition.onerror = null;
      recognition.onend = null;
      try { recognition.abort(); } catch (_) { /* It may have ended already. */ }
      $("agent_voice_status").textContent = "Dictation stopped.";
    }
    clearVoiceButton();
  }

  $("agent_voice").onclick = () => {
    if (agentBusy || !SpeechRecognition) return;
    if (voiceRecognition) {
      voiceRecognition.stop();
      $("agent_voice_status").textContent = "Finishing dictation…";
      return;
    }
    const recognition = new SpeechRecognition();
    voiceRecognition = recognition;
    const field = $("agent_goal");
    voiceBaseText = field.dataset.suggested === "true" ? "" : field.value.trimEnd();
    if (!voiceBaseText) field.value = "";
    field.dataset.suggested = "false";
    recognition.lang = navigator.language || "en-US";
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => {
      if (voiceRecognition !== recognition) return;
      $("agent_voice").textContent = "■ Stop dictation";
      $("agent_voice").setAttribute("aria-label", "Stop voice dictation");
      $("agent_voice").setAttribute("aria-pressed", "true");
      $("agent_voice").classList.add("listening");
      $("agent_voice_status").textContent = "Listening… speak your task.";
      field.focus();
    };
    recognition.onresult = event => {
      if (voiceRecognition !== recognition || agentBusy) return;
      let spoken = "";
      for (let index = 0; index < event.results.length; index++) {
        spoken += event.results[index][0]?.transcript || "";
      }
      const transcript = [voiceBaseText, spoken.trim()].filter(Boolean).join(" ");
      field.value = transcript.slice(0, 2000);
      $("agent_voice_status").textContent = "Dictated text is in the prompt. Review it, then press Enter or Run.";
      field.setSelectionRange(field.value.length, field.value.length);
    };
    recognition.onerror = event => {
      if (voiceRecognition !== recognition) return;
      const messages = {
        "not-allowed": "Microphone access was denied. Allow microphone access for this site to dictate.",
        "service-not-allowed": "The browser speech service is unavailable.",
        "audio-capture": "No microphone was found.",
        "no-speech": "No speech was heard. Press Dictate and try again.",
        network: "The browser speech service could not be reached.",
      };
      $("agent_voice_status").textContent = messages[event.error] || `Voice input stopped (${event.error}).`;
    };
    recognition.onend = () => {
      if (voiceRecognition !== recognition) return;
      voiceRecognition = null;
      clearVoiceButton();
      if ($("agent_voice_status").textContent === "Listening… speak your task.") {
        $("agent_voice_status").textContent = "Dictation ended. Press Dictate to continue.";
      }
    };
    try {
      $("agent_voice_status").textContent = "Requesting microphone access…";
      recognition.start();
    } catch (error) {
      voiceRecognition = null;
      clearVoiceButton();
      $("agent_voice_status").textContent = "Could not start voice input: " + error.message;
    }
  };

  // v86 listens on window. Host UI keystrokes must never reach the guest,
  // including Enter's keyup after Run hides the focused textarea.
  const hostKeys = new Set();
  for (const host of [$("agent_panel"), document.querySelector(".titlebar")]) {
    host.addEventListener("keydown", event => {
      hostKeys.add(event.code || event.key);
      event.stopPropagation();
      if (event.target !== $("agent_goal") || event.isComposing) return;
      if (event.key === "ArrowRight" && !event.shiftKey && !event.ctrlKey && !event.altKey && !event.metaKey &&
          $("agent_goal").dataset.suggested === "true") {
        event.preventDefault();
        acceptPrompt();
      } else if (event.key === "Enter" && !event.shiftKey && !event.ctrlKey && !event.altKey && !event.metaKey) {
        event.preventDefault();
        if (!event.repeat) runAgent();
      }
    });
  }
  document.addEventListener("keydown", event => {
    // Holding Enter can retarget repeat events to body after the panel hides.
    if (hostKeys.has(event.code || event.key) && !$("agent_panel").contains(event.target) &&
        !document.querySelector(".titlebar").contains(event.target)) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);
  document.addEventListener("keyup", event => {
    if (hostKeys.delete(event.code || event.key) || $("agent_panel").contains(event.target) ||
        document.querySelector(".titlebar").contains(event.target)) event.stopPropagation();
  }, true);
  window.addEventListener("blur", () => hostKeys.clear());

  async function runAgent() {
    if (agentBusy || !emulator || !started || closed) return;
    const goal = $("agent_goal").value.trim();
    if (!goal) { $("agent_state").textContent = "Enter a goal first."; return; }
    acceptPrompt();
    cancelRequested = false;
    agentBusyState(true);
    stopDictationForRun();
    $("agent_activity").hidden = false;
    agentMessage("Starting agent…");
    showAgentPanel(false);
    try {
      const [{ WindowsAgent }] = await Promise.all([import("./w95-agent.mjs"), ensureOcr()]);
      if (cancelRequested || closed || $("window").classList.contains("minimized")) {
        agentMessage("Agent cancelled.");
        return;
      }
      agent = new WindowsAgent(emulator, () => {
        const canvas = $("screen_container").querySelector("canvas");
        return { w: canvas.width || 640, h: canvas.height || 480 };
      }, agentMessage,
      () => !closed && !$("window").classList.contains("minimized"));
      const result = await agent.run(goal);
      agentMessage(result.summary);
    } catch (error) {
      agentMessage(cancelRequested ? "Agent cancelled." : "Agent stopped: " + error.message);
    } finally {
      agent = null;
      agentBusyState(false);
    }
  }
  $("agent_run").onclick = runAgent;
  function stopAgent() {
    if (!agentBusy) return;
    cancelRequested = true;
    agent?.stop();
    agentMessage("Stopping agent…");
  }
  $("agent_cancel").onclick = stopAgent;
  $("agent_stop").onclick = stopAgent;

  function restoreWindow() {
    $("window").classList.remove("minimized");
    $("minimize").setAttribute("aria-label", "Minimize");
    $("minimize").title = "Minimize";
    if (resumeAfterMinimize && emulator) emulator.run();
    resumeAfterMinimize = false;
  }

  $("minimize").onclick = async () => {
    if ($("window").classList.contains("minimized")) {
      restoreWindow();
      return;
    }
    if (document.fullscreenElement) {
      try { await document.exitFullscreen(); } catch (_) { /* Continue minimizing. */ }
    }
    stopAgent();
    // The agent temporarily pauses the CPU while reading the screen.
    resumeAfterMinimize = !!emulator && (agentBusy || emulator.is_running());
    if (resumeAfterMinimize) emulator.stop();
    $("window").classList.add("minimized");
    $("minimize").setAttribute("aria-label", "Restore");
    $("minimize").title = "Restore";
  };

  $("maximize").onclick = async () => {
    if ($("window").classList.contains("minimized")) restoreWindow();
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await $("window").requestFullscreen();
    } catch (_) { /* Fullscreen can be denied by browser policy. */ }
  };

  $("close").onclick = async () => {
    closed = true;
    stopAgent();
    if (document.fullscreenElement) {
      try { await document.exitFullscreen(); } catch (_) { /* Continue closing. */ }
    }
    if (emulator?.is_running()) emulator.stop();
    networkSocket?.close();
    $("window").hidden = true;
    $("closed").hidden = false;
  };

  document.addEventListener("fullscreenchange", () => {
    const maximized = !!document.fullscreenElement;
    $("maximize").setAttribute("aria-label", maximized ? "Restore" : "Maximize");
    $("maximize").title = maximized ? "Restore" : "Maximize";
    $("maximize").textContent = maximized ? "❐" : "□";
  });
  boot();
})();
</script>
</body>
</html>
